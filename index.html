<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Sanitär GBS – Lernplattform</title>
  <meta name="description" content="Lernplattform und Unterrichts-Tagesprogramm für Sanitärinstallateurinnen und Sanitärinstallateure EFZ an der GBS St. Gallen." />
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <!-- Inter (Neue-Helvetica-naher Grotesk, Designvorbild gbssg.ch) via Bunny Fonts (DSGVO-freundlich) -->
  <link href="https://fonts.bunny.net/css?family=inter:300,400,500,600,700,800,900&display=swap" rel="stylesheet" />
  <!-- Mono (für Codes / Auftragsnummern / Daten) -->
  <link href="https://fonts.bunny.net/css?family=jetbrains-mono:400,500,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css?v=26" />
</head>
<body>
  <a href="#main" class="skip-link">Zum Inhalt springen</a>

  <div class="layout">
    <!-- Linke Sidebar: Primärnavigation (Desktop/Tablet) -->
    <aside class="sidebar" role="navigation" aria-label="Hauptnavigation">
      <div class="sidebar-top">
        <a href="#/" class="brand" data-link aria-label="GBS St. Gallen – Tagesprogramm">
          <span class="brand-logo">
            <img src="assets/img/gbs-logo.png" alt="GBS St. Gallen" />
          </span>
          <span class="brand-text">
            <strong>Sanitär GBS</strong>
            <small>Lernplattform</small>
          </span>
        </a>
        <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Navigation ein-/ausklappen" title="Navigation ein-/ausklappen">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M14 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <div class="sidebar-klasse">
        <label class="sidebar-label" for="sb-klasse">Klasse</label>
        <div class="select-wrap">
          <select id="sb-klasse" aria-label="Klasse wählen"></select>
          <svg class="select-chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <nav class="sidenav" aria-label="Bereiche">
        <a href="#/" data-link data-nav="tagesprogramm" title="Tagesprogramm">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Tagesprogramm</span>
        </a>
        <a href="#/suche" data-link data-nav="suche" title="Lernaufträge">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Lernaufträge</span>
        </a>
        <a href="#/ablauf" data-link data-nav="entdecken" title="Ablauf der Lehre">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 4v13a3 3 0 0 0 3 3h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="6" cy="4" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="13" cy="20" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Ablauf der Lehre</span>
        </a>
        <a href="#/kompetenzen" data-link data-nav="kompetenzen" title="Kompetenzen">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h16v3H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Kompetenzen</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <a href="#/info" data-link class="sidebar-sublink">Info</a>
        <a href="#/lehrer" data-link class="sidebar-sublink sidebar-lehrer">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          Lehrer-Bereich
        </a>
      </div>
    </aside>

    <!-- Inhaltsspalte -->
    <div class="content">
      <!-- Schlanker Kopf nur für Mobile/Teams-schmal -->
      <header class="mobile-topbar" role="banner">
        <a href="#/" class="brand brand-mobile" data-link aria-label="GBS St. Gallen – Startseite">
          <span class="brand-logo"><img src="assets/img/gbs-logo.png" alt="GBS St. Gallen" /></span>
          <span class="brand-text"><strong>Sanitär GBS</strong></span>
        </a>
      </header>

      <main id="main" class="main" tabindex="-1">
        <div id="view" class="view" aria-live="polite"></div>
      </main>

      <footer class="footer">
        <div class="footer-inner">
          <small>GBS St. Gallen · Fachgruppe Sanitär &amp; Spengler · © T. Arnold &amp; M. Item</small>
          <nav class="footer-more" aria-label="Mehr">
            <a href="#/info" data-link>Info</a>
            <a href="#/lehrer" data-link>Lehrer-Bereich</a>
          </nav>
        </div>
      </footer>
    </div>
  </div>

  <!-- Untere Navigation (Mobile / Teams-schmal) -->
  <nav class="bottomnav" aria-label="Mobile Hauptnavigation">
    <a href="#/" data-link data-nav="tagesprogramm">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 2v4M16 2v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Heute</span>
    </a>
    <a href="#/suche" data-link data-nav="suche">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Aufträge</span>
    </a>
    <a href="#/ablauf" data-link data-nav="entdecken">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 4v13a3 3 0 0 0 3 3h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="6" cy="4" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="13" cy="20" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Ablauf</span>
    </a>
    <a href="#/kompetenzen" data-link data-nav="kompetenzen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h16v3H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Kompetenzen</span>
    </a>
  </nav>

  <!-- PDF-Viewer-Modal (eingebetteter PDF-Viewer) -->
  <div id="pdf-modal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Auftrag ansehen">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel">
      <header class="modal-header">
        <h2 id="pdf-modal-title">Auftrag</h2>
        <div class="modal-tools">
          <a id="pdf-newtab" class="iconbtn iconbtn-text" href="#" target="_blank" rel="noopener" title="In neuem Tab öffnen">
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <button type="button" class="iconbtn iconbtn-close" data-close aria-label="Schliessen">✕</button>
        </div>
      </header>
      <div class="modal-body" id="pdf-stage">
        <div class="pdf-frame-wrap" id="pdf-frame-wrap">
          <iframe id="pdf-frame" class="pdf-frame" title="Auftrag-PDF" referrerpolicy="no-referrer"></iframe>
        </div>
        <p class="pdf-empty" id="pdf-empty" hidden>PDF wird geladen …</p>
      </div>
    </div>
  </div>

  <!-- Externe Bibliotheken: Fuse.js (Suche), PDF.js (nur für Vorschau-Thumbnails) per CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script type="module" src="assets/js/app.js?v=26"></script>
</body>
</html>
